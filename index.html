<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀버짓 (EduBudget)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .bg-gradient-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .autocomplete-suggestions { max-height: 250px; overflow-y: auto; border-radius: 12px; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(59, 130, 246, 0.05), 0 2px 8px -1px rgba(0, 0, 0, 0.02); }
        .list-item-active { background-color: #f0f7ff; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-blue-50/30 text-gray-800 min-h-screen font-sans">

    <header class="bg-gradient-header text-white sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-md">
        <div class="flex items-center gap-3.5">
            <div class="p-2.5 bg-white/10 rounded-xl backdrop-blur-sm flex items-center justify-center">
                <svg class="w-8 h-8 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight text-white">에듀버짓 <span class="text-xl font-normal text-blue-200/90 ml-1">EduBudget</span></h1>
                <p class="text-sm text-blue-100/80 font-bold mt-0.5">학교별 1인당 교육비 조회 시스템</p>
            </div>
        </div>
        
        <div class="flex flex-col sm:items-end gap-1">
            <div id="statusBadge" class="px-4 py-1.5 rounded-full text-xs font-black bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-sm flex items-center gap-1.5 backdrop-blur-md">
                <span class="animate-spin text-[10px]">🔄</span> 데이터 로드 중...
            </div>
            <span id="totalCountBadge" class="text-xs text-blue-200/70 font-bold px-1">등록 학교수: 전국 13,137교</span>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-4 flex flex-col gap-5">
            <div class="bg-white p-5 rounded-2xl border border-blue-100 card-shadow relative">
                <h2 class="text-xs font-black text-blue-600 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                    <span class="text-base">🔍</span> 학교명 직접 검색
                </h2>
                <div class="relative">
                    <input type="text" id="searchInput" disabled class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-sm placeholder-gray-400 font-medium" placeholder="학교명을 입력하세요">
                    <div id="autocompleteList" class="autocomplete-suggestions absolute left-0 right-0 mt-1 bg-white border border-blue-100 shadow-xl hidden z-40 custom-scrollbar"></div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-blue-100 card-shadow flex flex-col gap-4">

                    <span class="text-base">🎛️</span> 단계적 조건 검색

                <div><label class="block text-xs font-bold text-gray-500 mb-1">2. 교육지원청</label><select id="filterSupport" disabled class="w-full p-2.5 bg-blue-50/40 border border-blue-100 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">전체</option></select></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">3. 학교급</label><select id="filterLevel" disabled class="w-full p-2.5 bg-blue-50/40 border border-blue-100 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">전체</option></select></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">4. 설립구분</label><select id="filterType" disabled class="w-full p-2.5 bg-blue-50/40 border border-blue-100 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">전체</option></select></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">5. 학교특성</label><select id="filterFeature" disabled class="w-full p-2.5 bg-blue-50/40 border border-blue-100 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">전체</option></select></div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-blue-100 card-shadow flex-1 flex flex-col min-h-[300px]">
                <h2 class="text-xs font-black text-blue-600 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span class="flex items-center gap-1.5"><span class="text-base">📋</span> 필터 검색 결과</span>
                    <span id="filteredCount" class="text-white font-black text-xs bg-gradient-to-r from-orange-500 to-amber-500 px-2.5 py-1 rounded-full shadow-sm">0</span>
                </h2>
                <div id="schoolList" class="flex-1 overflow-y-auto custom-scrollbar max-h-[400px] lg:
