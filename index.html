<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀버짓 (EduBudget)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4a7c59;
            --primary-light: #68b0ab;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-main: #2f3e46;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --accent-color: #e56b6f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 헤더 스타일 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        /* 카드 공통 스타일 */
        .card {
            background: var(--card-background);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        /* 파일 업로드 섹션 */
        .upload-zone {
            border: 2px dashed var(--primary-light);
            background: #f0f7f4;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-zone:hover {
            background: #e2f0cb;
            border-color: var(--primary-color);
        }

        #csvFile {
            display: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 검색 섹션 */
        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-top: none;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .autocomplete-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f8f9fa;
        }

        .autocomplete-item:hover {
            background-color: #f1f5f2;
        }

        .autocomplete-item .sub-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 대시보드 레이아웃 */
        .dashboard {
            display: none;
        }

        /* 학교 기본 정보 Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-light);
        }

        .info-item label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-item span {
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
        }

        .info-item a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* 테이블 스타일 */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.95rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f2;
            color: var(--text-main);
            font-weight: 700;
            text-align: center;
        }

        th:first-child, td:first-child {
            text-align: center;
            font-weight: 600;
        }

        .bg-group-office {
            background-color: #f4faf6;
        }

        .bg-national {
            background-color: #fef9f9;
        }

        tr:hover {
            background-color: #fafbfc;
        }

        /* 차트 영역 */
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin-top: 15px;
        }

        /* 유틸리티 크기 */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            header h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            th, td { padding: 10px 8px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>에듀버짓 (EduBudget)</h1>
        <p>학교별 1인당 교육비 조회 시스템</p>
    </header>

    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('csvFile').click()">
            <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">
                📊여기를 클릭하여 '1인당교육비.csv' 파일을 선택해 주세요.
            </p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">
                데이터는 브라우저 내부에서만 안전하게 처리됩니다.
            </p>
            <input type="file" id="csvFile" accept=".csv">
            <div class="status-msg" id="statusMsg">파일이 아직 로드되지 않았습니다.</div>
        </div>
    </div>

    <div class="card" id="searchCard" style="display:none;">
        <div class="search-box">
            <input type="text" id="schoolSearch" placeholder="조회할 학교 이름을 입력하세요 (예: 청주혜원학교, 노천초등학교)..." autocomplete="off">
            <div class="autocomplete-list" id="autocompleteList"></div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        
        <div class="card">
            <h2 style="color: var(--primary-color); margin-bottom: 15px; font-size: 1.3rem;">🏫 학교 기본 정보</h2>
            <div class="info-grid" id="schoolInfoGrid">
                </div>
        </div>

        <div class="card">
            <h2 style="color: var(--primary-color); margin-bottom: 15px; font-size: 1.3rem;">💰 연도별 1인당 교육비 및 평균 비교 (단위: 원)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>구분</th>
                            <th>연도</th>
                            <th>1인당 기본적 교육활동비</th>
                            <th>1인당 선택적 교육활동비</th>
                            <th>1인당 교육비 (총액)</th>
                        </tr>
                    </thead>
                    <tbody id="financeTableBody">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2 style="color: var(--primary-color); margin-bottom: 15px; font-size: 1.3rem;">📈 3개년 1인당 총 교육비 비교 추이</h2>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

    </div>
</div>

<script>
    let rawData = [];
    let chartInstance = null;

    const csvFileInput = document.getElementById('csvFile');
    const statusMsg = document.getElementById('statusMsg');
    const searchCard = document.getElementById('searchCard');
    const schoolSearch = document.getElementById('schoolSearch');
    const autocompleteList = document.getElementById('autocompleteList');
    const dashboard = document.getElementById('dashboard');

    // 1. CSV 파일 해석 및 로드
    csvFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusMsg.textContent = "데이터를 분석하는 중입니다...";

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            dynamicTyping: true,
            complete: function(results) {
                rawData = results.data;
                statusMsg.textContent = `✅ 성공적으로 데이터를 불러왔습니다! (총 ${rawData.length.toLocaleString()}개 학교 데이터 포함)`;
                searchCard.style.display = 'block';
                dashboard.style.display = 'none';
                schoolSearch.value = '';
            },
            error: function(err) {
                statusMsg.textContent = "❌ 에러: CSV 파일을 읽지 못했습니다. 파일 인코딩 및 형식을 확인해 주세요.";
                console.error(err);
            }
        });
    });

    // 2. 자동완성 검색 기능
    schoolSearch.addEventListener('input', function() {
        const keyword = this.value.trim().toLowerCase();
        autocompleteList.innerHTML = '';

        if (!keyword) return;

        // 학교명 매칭 검색 (최대 10개 노출)
        const matches = rawData.filter(row => row['학교명'] && row['학교명'].toLowerCase().includes(keyword)).slice(0, 10);

        matches.forEach(school => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item';
            item.innerHTML = `
                <div><strong>${school['학교명']}</strong></div>
                <div class="sub-info">${school['시도교육청']} | ${school['학교급']} | ${school['설립구분']}</div>
            `;
            item.addEventListener('click', () => {
                schoolSearch.value = school['학교명'];
                autocompleteList.innerHTML = '';
                displaySchoolData(school);
            });
            autocompleteList.appendChild(item);
        });
    });

    // 외부 클릭 시 자동완성 닫기
    document.addEventListener('click', function(e) {
        if (e.target !== schoolSearch) {
            autocompleteList.innerHTML = '';
        }
    });

    // 숫자 콤마 포맷터 유틸리티 함수
    function formatNumber(val) {
        if (val === undefined || val === null || isNaN(Number(val))) return '-';
        return Math.round(Number(val)).toLocaleString();
    }

    // 날짜 포맷터 (YYYYMMDD -> YYYY년 MM월 DD일)
    function formatDate(val) {
        if(!val) return '-';
        const str = String(Math.round(val));
        if(str.length === 8) {
            return `${str.substring(0,4)}년 ${str.substring(4,6)}월 ${str.substring(6,8)}일`;
        }
        return str;
    }

    // 3. 특정 학교 선택 시 핵심 계산 및 데이터 화면 표출
    function displaySchoolData(selectedSchool) {
        dashboard.style.display = 'block';

        // 기준 조건 정의 (평균 도출용)
        const schoolLevel = selectedSchool['학교급'];
        const estType = selectedSchool['설립구분'];
        const specType = selectedSchool['학교특성'];
        const office = selectedSchool['시도교육청'];
        const subOffice = selectedSchool['교육지원청'];

        // --- 그룹 평균 그룹 계산 ---
        // A. 교육지원청 평균 그룹 필터링
        const officeGroup = rawData.filter(row => 
            row['시도교육청'] === office &&
            row['교육지원청'] === subOffice &&
            row['학교급'] === schoolLevel &&
            row['설립구분'] === estType &&
            row['학교특성'] === specType
        );

        // B. 전국 평균 그룹 필터링
        const nationalGroup = rawData.filter(row => 
            row['학교급'] === schoolLevel &&
            row['설립구분'] === estType &&
            row['학교특성'] === specType
        );

        // 연도별 항목별 평균을 구해주는 헬퍼 서브함수
        function getAverage(group, key) {
            const validRows = group.filter(row => row[key] !== undefined && row[key] !== null && row[key] !== '');
            if (validRows.length === 0) return 0;
            const sum = validRows.reduce((acc, cur) => acc + Number(cur[key]), 0);
            return sum / validRows.length;
        }

        // 3개년 통계 오브젝트 빌드
        const stats = {
            '24': {
                target: { base: selectedSchool['24년 1인당 기본적 교육활동비'], opt: selectedSchool['24년 1인당 선택적 교육활동비'], total: selectedSchool['24년 1인당 교육비'] },
                office: { base: getAverage(officeGroup, '24년 1인당 기본적 교육활동비'), opt: getAverage(officeGroup, '24년 1인당 선택적 교육활동비'), total: getAverage(officeGroup, '24년 1인당 교육비') },
                national: { base: getAverage(nationalGroup, '24년 1인당 기본적 교육활동비'), opt: getAverage(nationalGroup, '24년 1인당 선택적 교육활동비'), total: getAverage(nationalGroup, '24년 1인당 교육비') }
            },
            '23': {
                target: { base: selectedSchool['23년 1인당 기본적 교육활동비'], opt: selectedSchool['23년 1인당 선택적 교육활동비'], total: selectedSchool['23년 1인당 교육비'] },
                office: { base: getAverage(officeGroup, '23년 1인당 기본적 교육활동비'), opt: getAverage(officeGroup, '23년 1인당 선택적 교육활동비'), total: getAverage(officeGroup, '23년 1인당 교육비') },
                national: { base: getAverage(nationalGroup, '23년 1인당 기본적 교육활동비'), opt: getAverage(nationalGroup, '23년 1인당 선택적 교육활동비'), total: getAverage(nationalGroup, '23년 1인당 교육비') }
            },
            '22': {
                target: { base: selectedSchool['22년 1인당 기본적 교육활동비'], opt: selectedSchool['22년 1인당 선택적 교육활동비'], total: selectedSchool['22년 1인당 교육비'] },
                office: { base: getAverage(officeGroup, '22년 1인당 기본적 교육활동비'), opt: getAverage(officeGroup, '22년 1인당 선택적 교육활동비'), total: getAverage(officeGroup, '22년 1인당 교육비') },
                national: { base: getAverage(nationalGroup, '22년 1인당 기본적 교육활동비'), opt: getAverage(nationalGroup, '22년 1인당 선택적 교육활동비'), total: getAverage(nationalGroup, '22년 1인당 교육비') }
            }
        };

        // 3-1. 학교 기본정보 렌더링
        const infoGrid = document.getElementById('schoolInfoGrid');
        const homepage = selectedSchool['홈페이지 주소'];
        const homepageTag = homepage ? `<a href="${homepage.startsWith('http') ? homepage : 'http://'+homepage}" target="_blank">바로가기</a>` : '<span>-</span>';

        infoGrid.innerHTML = `
            <div class="info-item"><label>시도교육청</label><span>${selectedSchool['시도교육청'] || '-'}</span></div>
            <div class="info-item"><label>교육지원청</label><span>${selectedSchool['교육지원청'] || '-'}</span></div>
            <div class="info-item"><label>학교급</label><span>${selectedSchool['학교급'] || '-'}</span></div>
            <div class="info-item"><label>설립구분</label><span>${selectedSchool['설립구분'] || '-'}</span></div>
            <div class="info-item"><label>학교특성</label><span>${selectedSchool['학교특성'] || '일반'}</span></div>
            <div class="info-item"><label>개교기념일</label><span>${formatDate(selectedSchool['개교기념일'])}</span></div>
            <div class="info-item" style="grid-column: span 2;"><label>학교도로명 주소</label><span>${selectedSchool['학교도로명 주소'] || '-'}</span></div>
            <div class="info-item"><label>전화번호</label><span>${selectedSchool['전화번호'] || '-'}</span></div>
            <div class="info-item"><label>홈페이지</label>${homepageTag}</div>
        `;

        // 3-2. 데이터 비교 테이블 구성 테이블 생성
        const tbody = document.getElementById('financeTableBody');
        tbody.innerHTML = '';

        const years = ['24', '23', '22'];
        years.forEach(yr => {
            // 해당 학교 행
            const trTarget = document.createElement('tr');
            trTarget.innerHTML = `
                <td rowspan="3" style="vertical-align: middle; background-color:#fff; font-weight:bold; text-align:center; border-right: 1px solid var(--border-color)">20${yr}년</td>
                <td>선택 학교</td>
                <td>${formatNumber(stats[yr].target.base)}</td>
                <td>${formatNumber(stats[yr].target.opt)}</td>
                <td style="font-weight:700; color:var(--primary-color);">${formatNumber(stats[yr].target.total)}</td>
            `;
            tbody.appendChild(trTarget);

            // 교육지원청 평균 행
            const trOffice = document.createElement('tr');
            trOffice.className = 'bg-group-office';
            trOffice.innerHTML = `
                <td>교육지원청 평균*</td>
                <td>${formatNumber(stats[yr].office.base)}</td>
                <td>${formatNumber(stats[yr].office.opt)}</td>
                <td style="font-weight:600;">${formatNumber(stats[yr].office.total)}</td>
            `;
            tbody.appendChild(trOffice);

            // 전국 평균 행
            const trNational = document.createElement('tr');
            trNational.className = 'bg-national';
            trNational.innerHTML = `
                <td>전국 평균*</td>
                <td>${formatNumber(stats[yr].national.base)}</td>
                <td>${formatNumber(stats[yr].national.opt)}</td>
                <td style="font-weight:600;">${formatNumber(stats[yr].national.total)}</td>
            `;
            tbody.appendChild(trNational);
        });

        // 3-3. Chart.js 추이 시각화
        if (chartInstance) {
            chartInstance.destroy(); // 기존 차트 객체 초기화 처리
        }

        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2022년', '2023년', '2024년'],
                datasets: [
                    {
                        label: `${selectedSchool['학교명']} (총액)`,
                        data: [stats['22'].target.total, stats['23'].target.total, stats['24'].target.total],
                        borderColor: '#4a7c59',
                        backgroundColor: '#4a7c59',
                        borderWidth: 3,
                        pointRadius: 5,
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: '동일 조건 교육지원청 평균',
                        data: [stats['22'].office.total, stats['23'].office.total, stats['24'].office.total],
                        borderColor: '#68b0ab',
                        backgroundColor: '#68b0ab',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 4,
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: '동일 조건 전국 평균',
                        data: [stats['22'].national.total, stats['23'].national.total, stats['24'].national.total],
                        borderColor: '#e56b6f',
                        backgroundColor: '#e56b6f',
                        borderWidth: 2,
                        borderDash: [2, 2],
                        pointRadius: 4,
                        fill: false,
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: !0,
                maintainAspectRatio: !1,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y.toLocaleString() + '원';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: { display: true, text: '금액 (원)' },
                        ticks: {
                            callback: function(value) { return value.toLocaleString(); }
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
